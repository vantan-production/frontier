spring.application.name=ems

# Docker 起動時は compose の環境変数が入る。
# IDE から直接起動したときは : 以降のローカル用の値が使われる。
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# 起動時の警告を消す
spring.jpa.open-in-view=false

# スキーマは Flyway が管理する（db/migration 配下の V*.sql）。
# Hibernate には一切 DDL を発行させない。
# エンティティを書き始めたら validate に変えると、設計書と実装のズレを起動時に検出できる。
spring.jpa.hibernate.ddl-auto=none